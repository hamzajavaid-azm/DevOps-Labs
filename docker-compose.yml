# Runs the Todo stack with Docker Compose. Run from the repository ROOT:
#
#   docker compose up --build
#
# Copy .env.example to .env and set SA_PASSWORD first. The API applies its EF Core
# migrations on startup (with retries), so the schema is created automatically once
# the database is reachable.
#
# The Angular frontend (UI-Angular) can be added as another service later — see the
# commented "web" block at the bottom.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Holds the API back until SQL Server is actually accepting logins.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      # Build context is the API/ folder; its Dockerfile lives there.
      context: ./API
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # Connection string is injected at runtime (never hard-coded in the app).
      # "db" is the compose service name, resolved on the compose network.
      ConnectionStrings__Default: "Server=db,1433;Database=TodoDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    ports:
      # Host 5184 -> container 8080, so the Angular UI's API_BASE keeps working.
      - "5184:8080"
    depends_on:
      db:
        condition: service_healthy

  # --- Frontend: Angular UI served by nginx ---
  web:
    build:
      context: ./UI-Angular
      dockerfile: Dockerfile
    ports:
      # Host 4200 -> nginx port 80. The browser calls the API at localhost:5184
      # (API_BASE in task.service.ts); CORS already allows the 4200 origin.
      - "4200:80"
    depends_on:
      - api

volumes:
  mssql-data:
