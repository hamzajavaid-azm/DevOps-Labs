name: Frontend CI

# Only runs when frontend files change (or this workflow itself).
on:
  push:
    branches: [dev]
    paths:
      - 'UI-Angular/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'UI-Angular/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    name: Build UI (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI-Angular
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: UI-Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build and Push UI Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./UI-Angular
          file: ./UI-Angular/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-web:${{ github.ref_name }}      
  
  deploy:
    name: Deploy UI to Local Ubuntu
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Pull and restart todo-web
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker pull $DOCKERHUB_USERNAME/todo-web:dev
          docker rm -f todo-web || true
          docker run -d \
            --name todo-web \
            --network todo-net \
            --restart unless-stopped \
            -p 4200:80 \
            $DOCKERHUB_USERNAME/todo-web:dev

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build, docker, deploy]
    if: always()   # fire on success AND failure, so any error reaches Slack
    steps:
      - name: Send pipeline result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # No-op (don't fail the run) if the webhook secret isn't configured yet.
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          # Overall result: FAILED if any needed job failed/was cancelled, else SUCCEEDED
          # (skipped jobs on a PR count as success).
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            STATUS="❌ FAILED"
          else
            STATUS="✅ SUCCEEDED"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '*Frontend CI* %s\n*Branch:* `%s`  •  *Commit:* `%s`\n*By:* %s\n<%s|View run>' \
            "$STATUS" "${{ github.ref_name }}" "${GITHUB_SHA::7}" "${{ github.actor }}" "$RUN_URL")
          # jq builds safe JSON (ubuntu-latest ships jq); curl -f fails the step on a non-2xx.
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"