name: Frontend CI

# Only runs when frontend files change (or this workflow itself).
on:
  push:
    branches: [dev]
    paths:
      - 'UI-Angular/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'UI-Angular/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    name: Build UI (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI-Angular
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: UI-Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build
