# Serves the built Angular app and supports client-side (SPA) routing:
# unknown paths fall back to index.html so Angular's router can handle them.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets aggressively (filenames change on each build).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else -> index.html (SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
